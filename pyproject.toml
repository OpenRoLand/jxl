[project]
name = "openroland-jxl"
dynamic = ["version"]
# version = "0.0.1"
description = "JXL job-file survey point parser and canonical openroland-survey-core extractor adapter."
authors = [{name = "Nicu Tofan", email = "nicu.tofan@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "arrow==1.4.0",
    "attrs==26.1.0",
    "lxml==6.1.1",
    "openroland-survey-core>=0.1.0",
]


[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "build==1.5.0",
    "flake8==7.0.0",
    "isort==8.0.1",
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pyproject-flake8==7.0.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest==9.1.1",
    "twine==7.0.0",
    "wheel==0.47.0",
]


[project.entry-points."openroland_survey.extractors"]
jxl = "openroland_jxl.extractor:JxlExtractor"


[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=67.0", "setuptools_scm[toml]>=8"]


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = ["openroland_jxl*"]
exclude = ["venv*", "playground*", "tests*"]


[tool.setuptools_scm]
fallback_version = "0.0.1-dev"
write_to = "openroland_jxl/__version__.py"


[tool.isort]

# Make isort compatible with black
profile = "black"

skip = [
    "test_*.py", "*_test.py",
    "tests_*.py", "*_tests.py",
    "spec_*.py", "*_spec.py",
    "specs_*.py", "*_specs.py",
]
src_paths = "openroland_jxl"
known_first_party = "openroland_jxl"
line_length = 80

[tool.black]

# Standard black line length is 88
line-length = 80

# Python versions that should be supported by Black's output
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py", "*_test.py",
    "tests_*.py", "*_tests.py",
    "spec_*.py", "*_spec.py",
    "specs_*.py", "*_specs.py",
]
python_classes = ["Test", "Acceptance"]
python_functions = ["test"]


[tool.mypy]
ignore_missing_imports = true
exclude = [
    ".+_tests?.py", "tests?_.+",
    ".+_specs?.py", "specs?_.+"
]


[tool.flake8]
max-line-length = 80
docstring-convention = "google"
exclude = [
    "test_*.py", "*_test.py",
    "tests_*.py", "*_tests.py",
    "spec_*.py", "*_spec.py",
    "specs_*.py", "*_specs.py",
]
extend-ignore = "E203, E501, E704"

[project.urls]
Homepage = "https://github.com/OpenRoLand/openroland-jxl"
Repository = "https://github.com/OpenRoLand/openroland-jxl"
Issues = "https://github.com/OpenRoLand/openroland-jxl/issues"
